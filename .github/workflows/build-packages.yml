name: build-packages

# Tkinter 4.x packaging (frozen line). Building a tag packages the Configurator
# on the matching platform runners and publishes Linux AppImage and macOS ARM64
# DMG assets. PyInstaller does not cross-compile, so each OS is built on its
# own runner. v5+ tags are handled by build-electron.yml instead.
on:
  push:
    tags:
      - 'v4*'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r src/requirements.txt
      - name: Install AppImage runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libfuse2
      - name: Build
        run: cd src && python _build_linux_pyinstaller.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: src/duckyPad-Configurator_*_x86_64.AppImage

  macos-arm:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r src/requirements.txt
      - name: Build
        run: cd src && python _build_mac_pyinstaller.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm
          path: src/duckyPad-Configurator_*_macOS_ARM64.dmg

  release:
    needs: [linux, macos-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/linux/duckyPad-Configurator_*_x86_64.AppImage
            artifacts/macos-arm/duckyPad-Configurator_*_macOS_ARM64.dmg
