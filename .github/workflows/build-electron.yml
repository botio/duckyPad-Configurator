name: build-electron

on:
  push:
    tags:
      - 'v5*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: app/package-lock.json }
      - name: Install Linux HID runtime
        run: sudo apt-get update && sudo apt-get install -y libhidapi-hidraw0 libfuse2
      - name: Install Python sidecar dependencies
        run: pip install -r src/requirements.txt
      - name: Build Python sidecar
        run: python src/_build_sidecar.py
      - name: Install Electron dependencies
        working-directory: app
        run: npm ci
      - name: Build AppImage
        working-directory: app
        run: npx electron-builder --linux AppImage --x64
      - uses: actions/upload-artifact@v4
        with:
          name: electron-linux
          path: release/*.AppImage

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: app/package-lock.json }
      - name: Install Python sidecar dependencies
        run: pip install -r src/requirements.txt
      - name: Build Python sidecar
        run: python src/_build_sidecar.py
      - name: Create macOS icon
        run: |
          mkdir -p app/resources/icon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" src/_icon_512.png --out "app/resources/icon.iconset/icon_${size}x${size}.png" >/dev/null
            pixels=$((size * 2))
            sips -z "$pixels" "$pixels" src/_icon_512.png --out "app/resources/icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns app/resources/icon.iconset -o app/resources/icon.icns
      - name: Install Electron dependencies
        working-directory: app
        run: npm ci
      - name: Build Apple Silicon DMG
        working-directory: app
        run: npx electron-builder --mac dmg --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: electron-macos-arm64
          path: release/*.dmg

  macos-x64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: app/package-lock.json }
      - name: Install Python sidecar dependencies
        run: pip install -r src/requirements.txt
      - name: Build Python sidecar
        run: python src/_build_sidecar.py
      - name: Create macOS icon
        run: |
          mkdir -p app/resources/icon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" src/_icon_512.png --out "app/resources/icon.iconset/icon_${size}x${size}.png" >/dev/null
            pixels=$((size * 2))
            sips -z "$pixels" "$pixels" src/_icon_512.png --out "app/resources/icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns app/resources/icon.iconset -o app/resources/icon.icns
      - name: Install Electron dependencies
        working-directory: app
        run: npm ci
      - name: Build Intel DMG
        working-directory: app
        run: npx electron-builder --mac dmg --x64
      - uses: actions/upload-artifact@v4
        with:
          name: electron-macos-x64
          path: release/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: app/package-lock.json }
      - name: Install Python sidecar dependencies
        run: pip install -r src/requirements.txt
      - name: Build Python sidecar
        run: python src/_build_sidecar.py
      - name: Install Electron dependencies
        working-directory: app
        run: npm ci
      - name: Build NSIS installer
        working-directory: app
        run: npx electron-builder --win nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: electron-windows
          path: release/*.exe

  release:
    needs: [linux, macos-arm64, macos-x64, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
